<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient Registration | Heart AI</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#020817;color:#e8eef8;font-family:Arial,sans-serif}.card{width:min(480px,calc(100% - 30px));background:#071525;border:1px solid #18304a;border-radius:20px;padding:28px}.field{margin:14px 0}.field label{display:block;font-size:12px;color:#9db0c5;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #23415d;background:#06111e;color:#fff}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#38bdf8;font-weight:700}.error{padding:10px;background:#351923;color:#ff9eb0;border-radius:10px}.links{margin-top:15px}.links a{color:#7dd3fc}</style></head><body><div class="card"><h1>Create Patient Account</h1><p>All predictions, reports, XAI results and history created from this account remain linked to its patient ID.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><div class="field"><label>Full Name</label><input name="full_name" required></div><div class="field"><label>Email</label><input type="email" name="email" required></div><div class="field"><label>Password (8+ characters)</label><input type="password" name="password" required></div><button class="btn">Create Account</button></form><div class="links"><a href="{{ url_for('login') }}">← Back to One Login</a></div></div></body></html>
