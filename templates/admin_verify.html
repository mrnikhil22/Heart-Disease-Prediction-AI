<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Email Verification | Heart AI</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#020817;color:#e8eef8;font-family:Arial,sans-serif}.card{width:min(470px,calc(100% - 30px));background:#071525;border:1px solid #18304a;border-radius:20px;padding:28px}.muted{color:#8fa3bd;font-size:13px}.field{margin:14px 0}.field label{display:block;font-size:12px;color:#9db0c5;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #23415d;background:#06111e;color:#fff}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#22c55e;font-weight:700}.error{padding:10px;background:#351923;color:#ff9eb0;border-radius:10px}.msg{padding:10px;background:#0b2a24;color:#8af0c7;border-radius:10px}</style></head><body><div class="card"><h1>Administrator Verification</h1><p class="muted">A one-time code has been sent to <strong>{{ email }}</strong>. Enter it and create the password for this administrator account.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}{% if message %}<div class="msg">{{ message }}</div>{% endif %}<form method="post"><div class="field"><label>6-Digit OTP</label><input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></div><div class="field"><label>New Password</label><input type="password" name="password" minlength="8" required></div><div class="field"><label>Confirm Password</label><input type="password" name="confirm_password" minlength="8" required></div><button class="btn">Verify Email & Set Password</button></form></div></body></html>
